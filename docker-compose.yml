version: '3.8'

services:
  api:
    build:
      context: .
    ports:
      - "80:5000"
    restart: "unless-stopped"
    volumes:
      - ./US_patched.cxi:/opt/US.cxi
      - ./EU_patched.cxi:/opt/EU.cxi
      - ./KR_patched.cxi:/opt/KR.cxi
      - ./JP_patched.cxi:/opt/JP.cxi
      - ./com.nintendo.zaaa_2.4.0.apk:/app/com.nintendo.zaaa_2.4.0.apk
      - ./ttsfs:/app/ttsfs